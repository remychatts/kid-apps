<!doctype html>
<html lang="en" style="background: #050915">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050915" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Arial vs Helvetica</title>
    <style>
      :root {
        --bg-dark: #050915;
        --panel: #0c1633;
        --cyan: #25f5ff;
        --purple: #7c3aed;
        --green: #3ddc97;
        --pink: #ff4ecd;
        --white: #eef2ff;
        --glow: 0 0 20px rgba(37, 245, 255, 0.55);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(37, 245, 255, 0.08),
            transparent 35%
          ),
          radial-gradient(
            circle at 80% 10%,
            rgba(124, 58, 237, 0.15),
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 70%,
            rgba(61, 220, 151, 0.12),
            transparent 35%
          ),
          linear-gradient(135deg, #050915 0%, #0b1530 80%);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .app {
        width: min(900px, 100%);
        background: linear-gradient(
          145deg,
          rgba(12, 22, 51, 0.9),
          rgba(5, 9, 21, 0.95)
        );
        border: 1px solid rgba(37, 245, 255, 0.15);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.35),
          inset 0 0 20px rgba(124, 58, 237, 0.12);
        border-radius: 24px;
        padding: 24px;
        overflow: hidden;
        position: relative;
      }

      .app::before,
      .app::after {
        content: "";
        position: absolute;
        inset: -60px;
        background: radial-gradient(
          circle,
          rgba(255, 78, 205, 0.08),
          transparent 40%
        );
        filter: blur(40px);
        opacity: 0.8;
        pointer-events: none;
      }

      .app::after {
        inset: auto -60px -60px auto;
        background: radial-gradient(
          circle,
          rgba(37, 245, 255, 0.1),
          transparent 40%
        );
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        z-index: 1;
        position: relative;
      }

      .title {
        font-size: 1.4rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--cyan);
        display: flex;
        align-items: baseline;
        gap: 10px;
        text-shadow: var(--glow);
      }

      .title span {
        color: var(--purple);
        font-weight: 700;
      }

      .tagline {
        font-size: 0.9rem;
        color: rgba(238, 242, 255, 0.8);
      }

      .scoreboard {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--white);
        font-weight: 600;
      }

      .scoreboard .pill {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(37, 245, 255, 0.35);
        border-radius: 999px;
        padding: 8px 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: inset 0 0 10px rgba(124, 58, 237, 0.12);
      }

      .pill strong {
        color: var(--cyan);
      }

      .panel {
        margin-top: 18px;
        padding: 18px;
        border-radius: 18px;
        border: 1px solid rgba(37, 245, 255, 0.25);
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(4px);
        position: relative;
        overflow: hidden;
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(37, 245, 255, 0.08),
          rgba(124, 58, 237, 0.05)
        );
        opacity: 0;
        transition: opacity 300ms ease;
        pointer-events: none;
      }

      .panel.active::before {
        opacity: 1;
      }

      .hero {
        text-align: center;
        padding: 26px 16px 14px;
        position: relative;
      }

      .glyph-display {
        font-size: clamp(120px, 26vw, 210px);
        margin: 6px auto;
        line-height: 1;
        color: var(--white);
        text-shadow:
          0 10px 25px rgba(0, 0, 0, 0.5),
          0 0 24px rgba(37, 245, 255, 0.5);
        transition:
          transform 250ms ease,
          filter 250ms ease,
          color 250ms ease;
        display: inline-block;
        padding: 12px 18px;
        border-radius: 20px;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.02)
        );
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .glyph-display.word {
        font-size: clamp(48px, 10vw, 92px);
        padding: 16px 24px;
      }

      .glyph-display.success {
        animation: pulse 600ms ease;
        color: var(--green);
      }
      .glyph-display.fail {
        animation: shake 450ms ease;
        color: var(--pink);
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          filter: drop-shadow(0 0 0 rgba(61, 220, 151, 0.1));
        }
        50% {
          transform: scale(1.06);
          filter: drop-shadow(0 0 18px rgba(61, 220, 151, 0.5));
        }
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 0 rgba(61, 220, 151, 0.1));
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(8px);
        }
        60% {
          transform: translateX(-6px);
        }
        80% {
          transform: translateX(6px);
        }
      }

      .phase-label {
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-size: 0.9rem;
        color: rgba(238, 242, 255, 0.8);
      }

      .controls {
        margin: 10px auto 6px;
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: 12px;
        padding: 14px 22px;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #0b1021;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          background 180ms ease;
        min-width: 140px;
      }

      .btn-font {
        background: linear-gradient(145deg, var(--cyan), #7af1ff);
        box-shadow: 0 10px 30px rgba(37, 245, 255, 0.28);
      }
      .btn-font.helvetica {
        background: linear-gradient(145deg, var(--purple), #c084fc);
        box-shadow: 0 10px 30px rgba(124, 58, 237, 0.3);
        color: #f7f2ff;
      }
      .btn-font:active {
        transform: translateY(2px) scale(0.99);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid rgba(37, 245, 255, 0.4);
        color: var(--white);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .message {
        text-align: center;
        margin-top: 8px;
        min-height: 28px;
        color: rgba(238, 242, 255, 0.9);
        font-weight: 500;
      }

      .progress-track {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .chip {
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
        color: rgba(238, 242, 255, 0.85);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        letter-spacing: 0.5px;
      }

      .chip .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      }

      .chip.done .dot {
        background: var(--green);
        box-shadow: 0 0 10px rgba(61, 220, 151, 0.8);
      }

      .streak {
        margin-top: 8px;
        text-align: center;
        font-size: 0.95rem;
        color: rgba(37, 245, 255, 0.9);
      }

      .help-button {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 5;
        min-width: auto;
        padding: 12px 20px;
        background: linear-gradient(145deg, var(--green), #9affce);
        box-shadow: 0 10px 30px rgba(61, 220, 151, 0.28);
      }

      .help-dialog {
        width: min(720px, calc(100% - 32px));
        max-height: calc(100vh - 32px);
        padding: 0;
        border: 1px solid rgba(37, 245, 255, 0.45);
        border-radius: 20px;
        color: var(--white);
        background: #0c1633;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
      }

      .help-dialog::backdrop {
        background: rgba(2, 5, 14, 0.8);
        backdrop-filter: blur(5px);
      }

      .help-sheet {
        padding: 28px;
      }

      .help-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      .help-header h2 {
        margin: 0 0 6px;
        color: var(--cyan);
      }
      .help-header p {
        margin: 0;
        color: rgba(238, 242, 255, 0.75);
      }

      .help-actions {
        display: flex;
        gap: 8px;
      }
      .help-actions button {
        min-width: auto;
        padding: 10px 14px;
      }

      .letter-grid {
        display: grid;
        gap: 12px;
      }

      .letter-pair {
        display: grid;
        grid-template-columns: 52px 1fr 1fr;
        align-items: stretch;
        gap: 12px;
        break-inside: avoid;
      }

      .pair-label {
        display: grid;
        place-items: center;
        font-weight: 800;
        color: var(--cyan);
        background: rgba(37, 245, 255, 0.08);
        border-radius: 12px;
      }

      .font-alternative {
        min-height: 96px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: 8px 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.035);
      }

      .font-sample {
        font-size: 68px;
        line-height: 1;
      }
      .font-name {
        font:
          700 0.8rem "Segoe UI",
          sans-serif;
        color: rgba(238, 242, 255, 0.72);
      }

      .celebration {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .confetti {
        position: absolute;
        width: 12px;
        height: 12px;
        background: var(--cyan);
        opacity: 0;
        animation: confetti 1600ms ease-in forwards;
        transform: rotate(0deg);
      }

      @keyframes confetti {
        0% {
          opacity: 1;
          transform: translateY(-20px) rotate(0deg);
        }
        100% {
          opacity: 0;
          transform: translateY(180px) rotate(280deg);
        }
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 560px) {
        .glyph-display {
          font-size: clamp(96px, 24vw, 160px);
        }
        .glyph-display.word {
          font-size: clamp(42px, 10vw, 74px);
        }
        button {
          width: 100%;
        }
        header {
          flex-direction: column;
          align-items: flex-start;
        }
        .help-button {
          right: 16px;
          bottom: 16px;
          width: auto;
        }
        .help-header {
          display: block;
        }
        .help-actions {
          margin-top: 14px;
        }
        .letter-pair {
          grid-template-columns: 36px 1fr 1fr;
          gap: 6px;
        }
        .font-alternative {
          min-height: 76px;
          padding: 6px 10px;
        }
        .font-sample {
          font-size: 52px;
        }
        .font-name {
          font-size: 0.68rem;
        }
      }

      @page {
        size: A4 portrait;
        margin: 12mm;
      }

      @media print {
        body {
          display: block;
          min-height: auto;
          padding: 0;
          background: white;
          color: black;
        }
        body > .app,
        .help-button {
          display: none !important;
        }
        .help-dialog[open] {
          display: block;
          position: static;
          width: auto;
          max-width: none;
          max-height: none;
          margin: 0;
          padding: 0;
          border: 0;
          color: black;
          background: white;
          box-shadow: none;
        }
        .help-sheet {
          padding: 0;
        }
        .help-header {
          margin-bottom: 6mm;
        }
        .help-header h2 {
          color: black;
        }
        .help-header p {
          color: #333;
        }
        .help-actions {
          display: none;
        }
        .letter-grid {
          gap: 3mm;
        }
        .letter-pair {
          grid-template-columns: 14mm 1fr 1fr;
          gap: 3mm;
        }
        .pair-label {
          color: black;
          background: #eee;
          border-radius: 2mm;
        }
        .font-alternative {
          min-height: 30mm;
          border: 0.3mm solid #bbb;
          border-radius: 2mm;
          background: white;
        }
        .font-sample {
          font-size: 54pt;
        }
        .font-name {
          color: #333;
        }
      }
    </style>
  </head>
  <body style="background-color: #050915">
    <div class="app">
      <header>
        <div>
          <div class="title">Arial vs Helvetica <span>(AvH)</span></div>
          <div class="tagline">Pick the font, earn the glory.</div>
        </div>
        <div class="scoreboard">
          <div class="pill">Score: <strong id="score">0</strong></div>
          <div class="pill">Phase: <strong id="phase">1</strong></div>
          <div class="pill">Streak: <strong id="streak">0</strong></div>
        </div>
      </header>

      <div class="panel active">
        <div class="hero">
          <div class="phase-label" id="phaseLabel">Phase 1 · Glyph Trials</div>
          <div id="glyph" class="glyph-display">a</div>
        </div>
        <div class="controls">
          <button class="btn-font" data-font="Arial">Arial</button>
          <button class="btn-font helvetica" data-font="Helvetica">
            Helvetica
          </button>
        </div>
        <div class="controls">
          <button id="startAgain" class="btn-secondary hidden">
            Start Again
          </button>
        </div>
        <div class="message" id="message">
          Guess the font to charge your plasma cannons.
        </div>
        <div class="streak" id="phaseStreakInfo">
          Glyph cycle resets on a wrong guess.
        </div>
        <div class="progress-track" id="progress"></div>
      </div>
      <div class="celebration" id="celebration"></div>
    </div>

    <button id="helpButton" class="help-button">Help</button>
    <dialog id="helpDialog" class="help-dialog" aria-labelledby="helpTitle">
      <div class="help-sheet">
        <div class="help-header">
          <div>
            <h2 id="helpTitle">Arial vs Helvetica reference</h2>
            <p>Compare each Phase 1 letter in both typefaces.</p>
          </div>
          <div class="help-actions">
            <button id="printHelp" class="btn-font">Print</button>
            <button id="closeHelp" class="btn-secondary">Close</button>
          </div>
        </div>
        <div id="letterGrid" class="letter-grid"></div>
      </div>
    </dialog>

    <script>
      const letters = ["a", "t", "C", "G", "R"];
      const fonts = ["Arial", "Helvetica"];
      const words = [
        "aga",
        "agama",
        "aka",
        "akala",
        "ala",
        "tatty",
        "tutti",
        "tot",
        "CAT",
        "COT",
        "CHIC",
        "COCA",
        "COCO",
        "EGG",
        "GAG",
        "GIG",
        "EGGY",
        "BURR",
        "OR",
        "MIRROR",
        "ROAR",
        "attaint",
        "tatty",
        "CRAG",
        "CROC",
        "GIGGER",
        "GROG",
        "CATARACT",
        "cataract",
        "attractor",
        "ATTRACTOR",
        "aggregator",
        "AGGREGATOR",
        "antarctica",
        "ANTARCTICA",
        "aggravator",
        "AGGRAVATOR",
        "reattract",
        "REATTRACT",
        "braggart",
        "BRAGGART",
      ];

      const glyphEl = document.getElementById("glyph");
      const scoreEl = document.getElementById("score");
      const phaseEl = document.getElementById("phase");
      const streakEl = document.getElementById("streak");
      const messageEl = document.getElementById("message");
      const phaseLabelEl = document.getElementById("phaseLabel");
      const progressEl = document.getElementById("progress");
      const phaseStreakInfoEl = document.getElementById("phaseStreakInfo");
      const startAgainBtn = document.getElementById("startAgain");
      const celebrationEl = document.getElementById("celebration");
      const helpButton = document.getElementById("helpButton");
      const helpDialog = document.getElementById("helpDialog");
      const closeHelpBtn = document.getElementById("closeHelp");
      const printHelpBtn = document.getElementById("printHelp");
      const letterGridEl = document.getElementById("letterGrid");

      let phase = 1;
      let score = 0;
      let streak = 0;
      let queue = [];
      let currentPair = null;
      let currentWord = null;
      let audioCtx = null;

      const letterFontPairs = letters.flatMap((letter) =>
        fonts.map((font) => ({ letter, font })),
      );

      function shuffle(list) {
        const arr = [...list];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function setFont(target, font) {
        target.style.fontFamily =
          font === "Helvetica"
            ? 'Helvetica, "Helvetica Neue", Arial, sans-serif'
            : 'Arial, "Helvetica Neue", Helvetica, sans-serif';
      }

      /* Builds the printable reference from the same letters used by Phase 1. */
      function renderHelpGrid() {
        letters.forEach((letter) => {
          const pair = document.createElement("div");
          pair.className = "letter-pair";

          const label = document.createElement("div");
          label.className = "pair-label";
          label.textContent = letter;
          pair.appendChild(label);

          fonts.forEach((font) => {
            const alternative = document.createElement("div");
            alternative.className = "font-alternative";

            const sample = document.createElement("span");
            sample.className = "font-sample";
            sample.textContent = letter;
            setFont(sample, font);

            const name = document.createElement("span");
            name.className = "font-name";
            name.textContent = font;

            alternative.append(sample, name);
            pair.appendChild(alternative);
          });

          letterGridEl.appendChild(pair);
        });
      }

      /* Keeps the Help control available only while the glyph phase is active. */
      function updateHelpVisibility() {
        helpButton.classList.toggle("hidden", phase !== 1);
        if (phase !== 1 && helpDialog.open) helpDialog.close();
      }

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      function playTone(
        frequency = 320,
        duration = 0.14,
        type = "sine",
        volume = 0.2,
      ) {
        if (!window.AudioContext && !window.webkitAudioContext) return;
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;
        osc.frequency.value = frequency;
        osc.type = type;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      /* Plays a timed collection of notes, allowing melodies and chords to overlap. */
      function playSequence(notes) {
        notes.forEach(({ delay, frequency, duration, type, volume }) => {
          setTimeout(() => playTone(frequency, duration, type, volume), delay);
        });
      }

      function playSuccessSound() {
        playTone(540, 0.15, "square", 0.25);
        setTimeout(() => playTone(720, 0.15, "triangle", 0.2), 80);
      }

      function playFailSound() {
        playTone(140, 0.22, "sawtooth", 0.23);
      }

      /* Rewards clearing the glyph trials with an ascending unlock fanfare. */
      function playPhaseCompleteSound() {
        playSequence([
          {
            delay: 120,
            frequency: 196,
            duration: 0.72,
            type: "sine",
            volume: 0.1,
          },
          {
            delay: 120,
            frequency: 392,
            duration: 0.2,
            type: "triangle",
            volume: 0.16,
          },
          {
            delay: 260,
            frequency: 523.25,
            duration: 0.2,
            type: "triangle",
            volume: 0.17,
          },
          {
            delay: 400,
            frequency: 659.25,
            duration: 0.22,
            type: "triangle",
            volume: 0.18,
          },
          {
            delay: 540,
            frequency: 783.99,
            duration: 0.28,
            type: "square",
            volume: 0.13,
          },
          {
            delay: 700,
            frequency: 523.25,
            duration: 0.62,
            type: "sine",
            volume: 0.08,
          },
          {
            delay: 700,
            frequency: 659.25,
            duration: 0.62,
            type: "sine",
            volume: 0.08,
          },
          {
            delay: 700,
            frequency: 783.99,
            duration: 0.62,
            type: "sine",
            volume: 0.08,
          },
        ]);
      }

      /* Celebrates the final victory with a longer arcade-style melody and final chord. */
      function playWinSound() {
        playSequence([
          {
            delay: 120,
            frequency: 196,
            duration: 0.28,
            type: "sine",
            volume: 0.11,
          },
          {
            delay: 120,
            frequency: 392,
            duration: 0.18,
            type: "square",
            volume: 0.13,
          },
          {
            delay: 240,
            frequency: 523.25,
            duration: 0.18,
            type: "triangle",
            volume: 0.17,
          },
          {
            delay: 360,
            frequency: 659.25,
            duration: 0.18,
            type: "triangle",
            volume: 0.18,
          },
          {
            delay: 480,
            frequency: 783.99,
            duration: 0.2,
            type: "square",
            volume: 0.13,
          },
          {
            delay: 620,
            frequency: 659.25,
            duration: 0.16,

      }

      function updateScoreboard() {
        scoreEl.textContent = score;
        streakEl.textContent = streak;
        phaseEl.textContent = phase;
      }

      function renderProgress() {
        progressEl.innerHTML = "";
        if (phase === 1) {
          letterFontPairs.forEach((pair) => {
            const chip = document.createElement("div");
            chip.className = "chip";
            const dot = document.createElement("div");
            dot.className = "dot";
            const completed = !queue.some(
              (q) => q.letter === pair.letter && q.font === pair.font,
            );
            if (
              completed &&
              currentPair &&
              !(
                currentPair.letter === pair.letter &&
                currentPair.font === pair.font
              )
            ) {
              chip.classList.add("done");
            }
            chip.innerHTML = `<span>${pair.letter.toUpperCase()} · ${pair.font}</span>`;
            chip.appendChild(dot);
            progressEl.appendChild(chip);
          });
        } else {
          const chip = document.createElement("div");
          chip.className = "chip done";
          chip.innerHTML = `<span>Phase 2 unlocked</span><div class="dot"></div>`;
          progressEl.appendChild(chip);
        }
      }

      function setGlyph(content, font, isWord = false) {
        glyphEl.textContent = content;
        glyphEl.classList.toggle("word", isWord);
        setFont(glyphEl, font);
      }

      function setMessage(text) {
        messageEl.textContent = text;
      }

      function resetPhase1Queue() {
        queue = shuffle(letterFontPairs);
      }

      function nextGlyph() {
        if (queue.length === 0) {
          startPhase2();
          return;
        }
        currentPair = queue.shift();
        setGlyph(currentPair.letter, currentPair.font, false);
        phaseLabelEl.textContent = "Phase 1 · Glyph Trials";
        phaseStreakInfoEl.textContent =
          "Clear every glyph + font combo without a miss to unlock the words.";
        setMessage("Is it Arial or Helvetica?");
        renderProgress();
      }

      function startPhase1() {
        phase = 1;
        streak = 0;
        score = 0;
        startAgainBtn.classList.add("hidden");
        resetPhase1Queue();
        updateScoreboard();
        updateHelpVisibility();
        renderProgress();
        nextGlyph();
      }

      function startPhase2() {
        phase = 2;
        streak = 0;
        playPhaseCompleteSound();
        updateScoreboard();
        updateHelpVisibility();
        renderProgress();
        phaseLabelEl.textContent = "Phase 2 · Word Arena";
        phaseStreakInfoEl.textContent =
          "Score ±1. 10 in a row to conquer the arena.";
        setMessage("Words incoming. Keep the streak alive!");
        nextWord();
      }

      function nextWord() {
        currentWord = {
          text: words[Math.floor(Math.random() * words.length)],
          font: fonts[Math.floor(Math.random() * fonts.length)],
        };
        setGlyph(currentWord.text, currentWord.font, true);
      }

      function celebrate() {
        setMessage("Victory! You survived the typographic showdown.");
        startAgainBtn.classList.remove("hidden");
        playWinSound();
        fireConfetti();
        glyphEl.classList.add("success");
        setTimeout(() => glyphEl.classList.remove("success"), 650);
      }

      function fireConfetti() {
        celebrationEl.innerHTML = "";
        const colors = [
          "var(--cyan)",
          "var(--purple)",
          "var(--green)",
          "var(--pink)",
          "var(--white)",
        ];
        for (let i = 0; i < 60; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = `${Math.random() * 100}%`;
          piece.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          piece.style.animationDelay = `${Math.random() * 200}ms`;
          piece.style.animationDuration = `${1200 + Math.random() * 600}ms`;
          celebrationEl.appendChild(piece);
        }
      }

      function handleGuess(fontChoice) {
        glyphEl.classList.remove("success", "fail");
        if (phase === 1) {
          if (fontChoice === currentPair.font) {
            score += 1;
            playSuccessSound();
            glyphEl.classList.add("success");
            setMessage(`Correct! ${currentPair.font} it is.`);
            nextGlyph();
          } else {
            score = 0;
            streak = 0;
            playFailSound();
            glyphEl.classList.add("fail");
            setMessage("Missed! Sequence reset—stay sharp.");
            resetPhase1Queue();
            nextGlyph();
          }
          updateScoreboard();
        } else {
          if (fontChoice === currentWord.font) {
            score += 1;
            streak += 1;
            playSuccessSound();
            glyphEl.classList.add("success");
            setMessage(`Nailed it. ${10 - streak} to ultimate victory.`);
            if (streak >= 10) {
              celebrate();
            } else {
              nextWord();
            }
          } else {
            score = Math.max(0, score - 1);
            playFailSound();
            glyphEl.classList.add("fail");
            setMessage("Wrong frequency. Streak reset.");
            streak = 0;
            nextWord();
          }
          updateScoreboard();
        }
      }

      document.querySelectorAll(".btn-font").forEach((btn) => {
        btn.addEventListener("click", () => {
          handleGuess(btn.dataset.font);
        });
      });

      startAgainBtn.addEventListener("click", () => {
        celebrationEl.innerHTML = "";
        startPhase1();
      });

      helpButton.addEventListener("click", () => helpDialog.showModal());
      closeHelpBtn.addEventListener("click", () => helpDialog.close());
      printHelpBtn.addEventListener("click", () => window.print());

      helpDialog.addEventListener("click", (event) => {
        if (event.target === helpDialog) helpDialog.close();
      });

      // Prime the UI
      renderHelpGrid();
      startPhase1();
    </script>
  </body>
</html>
