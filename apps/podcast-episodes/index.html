<!doctype html>
<html lang="en" style="background: #f8f9fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#d4419c" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Podcast Episodes</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: #f8f9fa;
        min-height: 100vh;
        padding: 20px;
      }

      .app {
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 20px 0;
      }

      .initial-loading {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        color: #7a1f59;
      }

      .initial-loading img {
        width: 72px;
        height: 72px;
      }

      .container {
        max-width: 800px;
        width: 100%;
      }

      .title {
        font-size: 2.5rem;
        font-weight: 400;
        margin-bottom: 2rem;
        color: #d4419c;
        text-align: center;
      }

      .card {
        background: #f9feff;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border: 1px solid #e9ecef;
      }

      .input-card {
        background: #f9feff;
      }

      .input-row {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }

      .input-wrapper {
        position: relative;
        flex: 1;
      }

      .input-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 16px;
        opacity: 0.6;
      }

      .search-input,
      .url-input {
        width: 100%;
        padding: 12px 12px 12px 40px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.2s;
      }

      .search-input:focus,
      .url-input:focus {
        outline: 0;
        border-color: #d4419c;
        box-shadow: 0 0 0 3px rgba(212, 65, 156, 0.1);
      }

      .load-button {
        padding: 12px 24px;
        background: #d4419c;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        white-space: nowrap;
      }

      .load-button:hover:not(:disabled) {
        background: #b8368a;
      }

      .load-button:disabled {
        background: #a0aec0;
        cursor: not-allowed;
      }

      .dropdown {
        position: relative;
      }

      .dropdown-trigger {
        width: 100%;
        padding: 12px 16px;
        background: #f7fafc;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .dropdown-trigger:hover {
        background: #edf2f7;
        border-color: #cbd5e0;
      }

      .dropdown-trigger::after {
        content: "▼";
        font-size: 12px;
        opacity: 0.6;
        transition: transform 0.2s;
      }

      .dropdown-trigger.open::after {
        transform: rotate(180deg);
      }

      .dropdown-content {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        z-index: 10;
        max-height: 200px;
        overflow-y: auto;
      }

      .dropdown-item {
        padding: 12px 16px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #f7fafc;
      }

      .dropdown-item:hover {
        background: #f7fafc;
      }

      .dropdown-item:last-child {
        border-bottom: none;
      }

      .remove-button {
        background: 0 0;
        border: none;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
        transition: background-color 0.2s;
      }

      .remove-button:hover {
        background: #fed7d7;
      }

      .error-message {
        color: #e53e3e;
        text-align: center;
        margin-bottom: 16px;
        padding: 12px;
        background: #fed7d7;
        border-radius: 8px;
        border: 1px solid #feb2b2;
      }

      .loading-container {
        margin-bottom: 16px;
      }

      .loading-text {
        text-align: center;
        margin-bottom: 8px;
        color: #4a5568;
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: #e2e8f0;
        border-radius: 4px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: #d4419c;
        transition: width 0.3s ease;
      }

      .episodes-card {
        background: #f9feff;
      }

      .feed-title {
        font-size: 1.5rem;
        font-weight: 400;
        margin-bottom: 16px;
        color: #d4419c;
      }

      .search-container {
        margin-bottom: 16px;
      }

      .episodes-list {
        list-style: none;
        margin-bottom: 16px;
      }

      .episode-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #f7fafc;
      }

      .episode-item:last-child {
        border-bottom: none;
      }

      .play-icon {
        font-size: 16px;
        opacity: 0.7;
      }

      .episode-link {
        color: #4a5568;
        text-decoration: none;
        transition: color 0.2s;
        flex: 1;
      }

      .episode-link:hover {
        color: #d4419c;
        text-decoration: underline;
      }

      .show-all-button {
        width: 100%;
        padding: 12px 16px;
        background: #f7fafc;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 16px;
      }

      .show-all-button:hover {
        background: #edf2f7;
        border-color: #cbd5e0;
      }

      .no-episodes {
        text-align: center;
        color: #718096;
        font-style: italic;
        padding: 24px;
      }

      @media (max-width: 768px) {
        .title {
          font-size: 2rem;
        }

        .input-row {
          flex-direction: column;
        }

        .card {
          padding: 16px;
        }

        body {
          padding: 10px;
        }
      }
    </style>
  </head>

  <body style="background-color: #f8f9fa">
    <div id="root" style="background-color: #f8f9fa">
      <div class="initial-loading">
        <img src="./icon.svg" alt="" width="72" height="72" /><span
          >Loading...</span
        >
      </div>
    </div>
    <script defer="defer" src="./episode-bundle.js"></script>
  </body>
</html>
